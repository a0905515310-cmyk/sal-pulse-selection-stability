name: Reproduce frozen figures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r environment/requirements.txt
      - name: Verify data and regenerate figures
        run: python code/reproduce.py --root .
